# Tags each pushed commit with the workflow run number, unless it's already tagged.
name: Tag on push

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    if: github.ref_name != 'uat'
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
      existing: ${{ steps.tag.outputs.existing }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag commit with run number if untagged
        id: tag
        env:
          TAG: ${{ github.run_number }}
        run: |
          existing=$(git tag --points-at "$GITHUB_SHA")
          if [ -n "$existing" ]; then
            echo "Run #$TAG: commit $GITHUB_SHA already tagged: $existing — skipping."
            echo "tagged=false" >> "$GITHUB_OUTPUT"
            echo "existing=$(echo $existing)" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists on another commit."
            exit 1
          fi

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "Run #$TAG: tagged $GITHUB_SHA as $TAG"
          echo "tagged=true" >> "$GITHUB_OUTPUT"

      - name: Commit release.tag
        if: steps.tag.outputs.tagged == 'true'
        env:
          TAG: ${{ github.run_number }}
        run: |
          echo "$TAG" > release.tag
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release.tag
          git commit -m "Update release.tag to $TAG [skip ci]"
          git push origin "HEAD:$GITHUB_REF_NAME"

  echo-add-tag:
    runs-on: ubuntu-latest
    needs: tag
    if: needs.tag.outputs.tagged == 'true'
    steps:
      - name: Report new tag
        run: |
          echo "::notice::Run #${{ github.run_number }}: tag created — ${{ github.sha }} is tagged (${{ github.run_number }})."

  echo-already-tagged:
    runs-on: ubuntu-latest
    needs: tag
    if: needs.tag.outputs.tagged == 'false'
    steps:
      - name: Report skipped tag
        env:
          EXISTING: ${{ needs.tag.outputs.existing }}
        run: |
          echo "::notice::Run #${{ github.run_number }}: no tag created — ${{ github.sha }} is already tagged ($EXISTING)."

  # On uat, tag the commit with the build number from release.tag, prefixed with uat-.
  uat-tag:
    runs-on: ubuntu-latest
    if: github.ref_name == 'uat'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Tag commit from release.tag
        run: |
          if [ ! -f release.tag ]; then
            echo "::error::release.tag not found on $GITHUB_SHA."
            exit 1
          fi

          TAG="uat-$(tr -d '[:space:]' < release.tag)"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::notice::$TAG already exists on $(git rev-list -n 1 "$TAG") — skipping."
            exit 0
          fi

          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          echo "::notice::Tagged $GITHUB_SHA as $TAG"
